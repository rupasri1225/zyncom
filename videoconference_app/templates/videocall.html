<!DOCTYPE html>
<html>

<head>

<title>Video Meeting</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="shortcut icon" href="https://st1.zoom.us/homepage/publish/zoom.ico">

<style>

body{
margin:0;
padding:0;
}

#root{
width:100vw;
height:100vh;
}

</style>

<script defer src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

</head>

<body>

<div id="root"></div>

<script>

document.addEventListener("DOMContentLoaded", function(){

const roomID = "{{ roomID }}"

const userID = Math.floor(Math.random()*100000)+"" 

const userName = "{{ name }}"

const appID = 2028868635
const serverSecret = "f57b818176b3c2dca1f04345c7e52c92"

if(typeof ZegoUIKitPrebuilt === "undefined"){

console.error("Zego SDK failed to load")

return

}

const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
appID,
serverSecret,
roomID,
userID,
userName
)

const zp = ZegoUIKitPrebuilt.create(kitToken)

zp.joinRoom({

container: document.querySelector("#root"),

sharedLinks:[
{
name:"Meeting Link",
url: window.location.protocol+"//"+window.location.host+"/meeting/?roomID="+roomID
}
],

scenario:{
mode: ZegoUIKitPrebuilt.VideoConference
},

turnOnMicrophoneWhenJoining:false,

turnOnCameraWhenJoining:false,

showMyCameraToggleButton:true,

showMyMicrophoneToggleButton:true,

showAudioVideoSettingsButton:true,

showScreenSharingButton:true,

showTextChat:true,

showUserList:true,

layout:"Grid",

maxUsers:50

})

})

</script>

</body>

</html>
